name: Pack-install smoke test

# G1 (openspec/changes/v1.0.0-api-surface, task 7.1): proves the PACKED tarball's frozen surface
# resolves for a real consumer. It `npm pack`s UmbraDB, installs the tarball into a throwaway scratch
# project, and from that project imports `{ createClient, runMigrations, PgTemporalKV, StorageError }`
# from "umbradb", runs `runMigrations` + a `PgTemporalKV.put`/`get` round-trip against a
# Testcontainers Postgres, asserts the deep import `umbradb/src/postgres/temporal-kv.js` is blocked by
# the strict `exports` map, and asserts `dist/index.d.ts` ships in the tarball.
#
# This is a SEPARATE workflow (not the required conformance gate) so its `npm pack` + tarball install
# never runs inside `vitest run`. Like `bench-smoke.yml` it uses Testcontainers (@testcontainers/
# postgresql), which starts its own disposable Postgres 17 container via the Docker daemon present on
# ubuntu-latest runners — no `services: postgres` block is needed. On a host with no Docker the smoke
# script prints SKIP and exits 0, so the no-Docker path is never broken.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pack-smoke-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Packed-tarball install smoke test (build -> pack -> install -> import + round-trip)
        # `npm run test:smoke` runs `npm run build` first (task 3 dist dependency), then the standalone
        # smoke harness. It fails the job on a real surface regression; it exits 0 (SKIP) only if Docker
        # is absent, which never happens on this runner.
        run: npm run test:smoke
