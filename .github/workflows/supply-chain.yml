name: Supply-chain gate

# v1.0.0-infosec-signoff (G18). Enforces the supply-chain hygiene the tree already has by luck of a
# fresh install: lockfile-pinned installs with no lifecycle scripts, a blocking runtime-scope
# `npm audit`, full-history secret scanning, container-CVE scanning of both pinned digests, and
# change-control on `flake.lock`. Actions are SHA-pinned (matching conformance.yml); the two CLI
# scanners are installed from version-pinned official releases rather than third-party actions so no
# unpinned/unverifiable action SHA enters the supply chain this workflow exists to protect.

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  schedule:
    # Weekly, so a newly-disclosed CVE against an unchanged pinned digest surfaces without a code change.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deps:
    # Dependency / secret / lock hygiene. Runs on every PR and push to main.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 -- full history is required for the flake.lock base-diff and the
      # full-history gitleaks scan below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Assert repo-root .npmrc sets ignore-scripts=true (config-drift guard)
        # G18 (3.1): a committed .npmrc must exist and set ignore-scripts=true. Because that also
        # suppresses THIS package's own prepare/postinstall hooks, the build/typecheck it depends on
        # MUST run as an explicit step (it does: `npm run typecheck` below, and `npm run build` in
        # pack-smoke.yml) -- never via a lifecycle hook. This step is the drift guard.
        run: |
          test -f .npmrc || { echo "::error file=.npmrc::repo-root .npmrc is missing"; exit 1; }
          # Assert npm's EFFECTIVE ignore-scripts, not just a line in .npmrc: `npm config get`
          # resolves the full precedence chain (this .npmrc, ~/.npmrc, /etc/npmrc, npm_config_* env),
          # so a later layer flipping it back to false is caught here too.
          EFF="$(npm config get ignore-scripts)"
          if [ "$EFF" != "true" ]; then
            echo "::error file=.npmrc::effective npm ignore-scripts is '$EFF', must be 'true'"; exit 1
          fi
          echo ".npmrc present and effective ignore-scripts=true"

      - name: Install dependencies (npm ci -- lockfile + integrity pinned, scripts ignored)
        # G18 (D1): npm ci, never npm install -- a tarball inconsistent with package-lock.json or its
        # integrity hashes hard-fails. ignore-scripts (from .npmrc) prevents any install script running.
        run: npm ci

      - name: Typecheck (EXPLICIT step -- not a lifecycle hook)
        # G18 (D2): proves the release's typecheck runs explicitly even with lifecycle scripts
        # ignored. This package declares no prepare/postinstall, so ignore-scripts suppresses nothing
        # the build needs; this step is the standing confirmation of that.
        run: npm run typecheck

      - name: npm audit -- blocking, runtime dependencies only (G18 D3)
        # Runtime deps are exactly `postgres` + `zod` (package.json). --omit=dev keeps the large dev
        # graph (vitest/testcontainers/stryker/...) out of the blocking gate, so a dev-only advisory
        # cannot fail it; a HIGH/CRITICAL advisory in a RUNTIME dep does.
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit -- full graph, NON-blocking (developer visibility)
        run: npm audit || true

      - name: Install gitleaks (version-pinned official release)
        # Version-pinned official release binary rather than a third-party action, to avoid an
        # unpinned/unverifiable action SHA in the supply chain this workflow protects.
        run: |
          set -euo pipefail
          VER=8.28.0
          # Pin the artifact by CONTENT, not just by version tag. A release asset can be replaced;
          # an unverified scanner that always exits 0 would silently disarm the gate it powers —
          # the exact supply-chain attack this workflow exists to prevent.
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c - || {
            echo "::error::gitleaks tarball checksum mismatch — refusing to run an unverified scanner."
            exit 1
          }
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks full-history secret scan (blocking, G18 D4 / G19)
        # Full git history (default `detect` git mode; needs the fetch-depth: 0 checkout above).
        # Driven by the committed .gitleaks.toml, whose allowlist covers EXACTLY the historical
        # preview-test-wallet.json path (valueless Preview secret kept in history -- no rewrite) and
        # the preview-test-wallet.example.json placeholder. Any real secret on ANY other path -- in
        # history or the working tree -- fails this step.
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="--all"

      - name: Image pins agree across flake.nix and start-stack.sh (G18 — audit gap)
        # The Trivy job derives its scan targets from flake.nix ONLY, and it runs on schedule /
        # workflow_dispatch. start-stack.sh independently hard-codes the references that actually
        # launch the containers. So a digest changed in start-stack.sh alone left flake.nix — and
        # therefore the scanned images — untouched: PR CI stayed green and the scheduled scan kept
        # examining an image nobody runs. This step makes the two files a single enforced pin set,
        # and it runs on every PR and push rather than only on the schedule.
        run: |
          set -euo pipefail
          fail=0
          for image in indexer-standalone proof-server; do
            # Anchored to the real reference form and required to be UNIQUE in each file: an
            # unanchored `grep | head -1` could be satisfied by a commented-out line placed above.
            mapfile -t flake_refs < <(grep -oE "midnightntwrk/${image}:[0-9.]+@sha256:[0-9a-f]{64}" nix/midnight-env/flake.nix | sort -u)
            mapfile -t stack_refs < <(grep -oE "midnightntwrk/${image}:[0-9.]+@sha256:[0-9a-f]{64}" nix/midnight-env/scripts/start-stack.sh | sort -u)

            if [ "${#flake_refs[@]}" -ne 1 ]; then
              echo "::error::expected exactly 1 distinct ${image} pin in flake.nix, found ${#flake_refs[@]}"; fail=1; continue
            fi
            if [ "${#stack_refs[@]}" -ne 1 ]; then
              echo "::error::expected exactly 1 distinct ${image} pin in start-stack.sh, found ${#stack_refs[@]}"; fail=1; continue
            fi
            if [ "${flake_refs[0]}" != "${stack_refs[0]}" ]; then
              echo "::error::${image} pin diverges between files — the scanned image is not the launched image."
              echo "::error::  flake.nix:       ${flake_refs[0]}"
              echo "::error::  start-stack.sh:  ${stack_refs[0]}"
              fail=1; continue
            fi
            echo "${image}: pins agree — ${flake_refs[0]}"
          done
          exit "$fail"

      - name: flake.lock change-control on direct push (G18 D6 — audit gap)
        # The PR-only check below is bypassed entirely by a direct push to main: the dependency job
        # runs on push, but the lock check did not, so a pushed `nix flake update` produced a green
        # supply-chain workflow with no label and no review evidence. A push has no PR label to
        # consult, so any lock change on a push is rejected outright — roll it forward through a PR.
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A branch-creation push has an all-zero "before" SHA and nothing to diff against.
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous SHA for this push (branch creation) — skipping lock diff"
            exit 0
          fi
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- nix/midnight-env/flake.lock; then
            echo "flake.lock unchanged in this push — ok"
            exit 0
          fi
          echo "::error::flake.lock changed in a direct push to ${GITHUB_REF_NAME}. Dependency-lock"
          echo "::error::roll-forwards must go through a pull request carrying the"
          echo "::error::'flake-lock-update' label, so the change is reviewable."
          exit 1

      - name: flake.lock change-control (PR only, G18 D6)
        # Fails a PR that modifies nix/midnight-env/flake.lock relative to its base branch UNLESS the
        # PR carries the `flake-lock-update` label. Pure git-diff + label read -- no Nix toolchain.
        # This catches a committed `nix flake update` roll-forward that a no-op re-lock check would miss.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF" -- nix/midnight-env/flake.lock; then
            echo "flake.lock unchanged vs base ($BASE_REF) -- ok"
            exit 0
          fi
          echo "flake.lock differs from base ($BASE_REF)."
          case ",${PR_LABELS}," in
            *,flake-lock-update,*)
              echo "PR carries the 'flake-lock-update' label -- change allowed."
              exit 0 ;;
            *)
              echo "::error file=nix/midnight-env/flake.lock::flake.lock changed without the 'flake-lock-update' label. Add the label to land a deliberate lock update."
              exit 1 ;;
          esac

  image-scan:
    # Container-CVE scan of BOTH digest-pinned images. Scheduled + on-demand only (the digests move
    # only on a deliberate bump, so a PR gate would fire only then). REPORTS (non-blocking) into the
    # job summary, per the design's policy choice.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Derive image pins from flake.nix and assert they match the expected digests
        # G18 (D5): the scan targets are read out of nix/midnight-env/flake.nix and asserted equal to
        # the known-good digests, so a silent digest bump in flake.nix cannot diverge from what Trivy
        # scans (and start-stack.sh uses the same two digests).
        id: pins
        run: |
          # `sort -u` + a uniqueness assert rather than `head -1`: with head, a commented-out or
          # stale reference sitting ABOVE the real one silently becomes the scanned target.
          INDEXER="$(grep -oE 'midnightntwrk/indexer-standalone:[0-9.]+@sha256:[0-9a-f]{64}' nix/midnight-env/flake.nix | sort -u)"
          PROOF="$(grep -oE 'midnightntwrk/proof-server:[0-9.]+@sha256:[0-9a-f]{64}' nix/midnight-env/flake.nix | sort -u)"
          [ "$(echo "$INDEXER" | grep -c .)" = "1" ] || { echo "::error::indexer-standalone pin in flake.nix is not unique"; exit 1; }
          [ "$(echo "$PROOF"   | grep -c .)" = "1" ] || { echo "::error::proof-server pin in flake.nix is not unique"; exit 1; }
          EXP_INDEXER="midnightntwrk/indexer-standalone:4.3.3@sha256:03afd079b00bcd229df29a24771439c5e7695c339cd89216d0763ce40731cc4b"
          EXP_PROOF="midnightntwrk/proof-server:8.1.0@sha256:801bbc0340e9e96f16735f77b523f23c7459e3359842f7c79c2c53f4e994d531"
          test -n "$INDEXER" || { echo "::error::could not read indexer-standalone pin from flake.nix"; exit 1; }
          test -n "$PROOF"   || { echo "::error::could not read proof-server pin from flake.nix"; exit 1; }
          [ "$INDEXER" = "$EXP_INDEXER" ] || { echo "::error::indexer-standalone pin in flake.nix ($INDEXER) diverged from the scanned reference"; exit 1; }
          [ "$PROOF" = "$EXP_PROOF" ]     || { echo "::error::proof-server pin in flake.nix ($PROOF) diverged from the scanned reference"; exit 1; }
          echo "indexer=$INDEXER" >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"
          echo "Scanning pinned digests:"; echo "  $INDEXER"; echo "  $PROOF"

      - name: Install Trivy (version-pinned official release)
        run: |
          set -euo pipefail
          # Fetch the installer by IMMUTABLE COMMIT SHA, not by tag: a tag can be moved, and this
          # script is piped straight into a root shell. Pinning the commit makes the fetched code
          # fixed even if the tag is repointed.
          TRIVY_INSTALL_COMMIT=7bcb181268893fdd69ef4582588c040bb1036c33
          curl -fsSL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALL_COMMIT}/contrib/install.sh" -o /tmp/trivy-install.sh
          sh /tmp/trivy-install.sh -b /usr/local/bin v0.66.0
          trivy --version

      - name: Trivy scan both pinned digests (HIGH,CRITICAL) -> job summary
        # Vulnerability FINDINGS are report-only (--exit-code 0) and written to the job summary. A
        # genuine scan-EXECUTION failure (registry/pull/DB/scanner error -> nonzero) is NOT swallowed:
        # it propagates and FAILS the job, so a green run means BOTH pinned digests were actually
        # scanned. Each digest is scanned in its own loop iteration and its scanner exit code checked.
        run: |
          echo "## Trivy image scan (HIGH,CRITICAL) - pinned digests" >> "$GITHUB_STEP_SUMMARY"
          rc=0
          for ref in "${{ steps.pins.outputs.indexer }}" "${{ steps.pins.outputs.proof }}"; do
            echo "### $ref" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # --exit-code 0: a HIGH/CRITICAL FINDING does not fail the step; a nonzero exit here is a
            # real scanner/execution error (bad ref, registry/pull/DB failure) and MUST fail the job.
            if trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress --scanners vuln "$ref" >> "$GITHUB_STEP_SUMMARY" 2>&1; then
              echo "scanned OK: $ref"
            else
              echo "::error::trivy FAILED TO SCAN $ref (execution error, not a finding) -- failing the job"
              rc=1
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$rc"
