name: Publish (npm + provenance)

# v1.0.0-infosec-signoff (R7). Provenance CANNOT be generated from a local machine: `npm publish
# --provenance` requires a supported cloud CI with an OIDC `id-token` and a `repository` URL that
# matches the building repo. This workflow is therefore a REQUIRED release artifact, not a
# convenience — without it the tag has no way to satisfy R7 except a recorded drop-ruling.
#
# Trigger is the `v*.*.*` tag itself (plus manual dispatch on the tag SHA for a re-run). The job
# re-verifies the tag it is publishing rather than trusting the trigger: the tag must be annotated,
# `package.json.version` must equal the tag, and `repository.url` must match this repo — a mismatch
# fails provenance at the registry with a far worse error than an early explicit one.
#
# Actions are SHA-pinned, matching conformance.yml / supply-chain.yml.

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      # `id-token: write` is what mints the OIDC token npm exchanges for a provenance attestation.
      # Without it `--provenance` fails; it is the entire reason this job cannot run locally.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Need the tag object itself (not just the commit) to assert it is annotated.
          fetch-depth: 0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the tag is annotated, clean, and self-consistent
        shell: bash
        # RELEASE_TAG is passed through `env`, never interpolated into the script body: `${{ }}`
        # substitution happens BEFORE bash parses the line, so a tag containing a quote or `;`
        # would otherwise execute attacker-chosen commands in a job that holds `id-token: write`
        # and NPM_TOKEN. Git permits such tag names.
        # https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          # Defence in depth: even via env, only an exact release-tag shape is allowed through.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::refusing to publish tag '$TAG' — not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "Publishing tag: ${TAG}"

          # R7: annotated tag, not lightweight. `cat-file -t` reads the OBJECT type: an annotated
          # tag is a `tag` object; a lightweight tag points straight at a `commit`.
          OBJECT_TYPE="$(git cat-file -t "${TAG}")"
          if [ "${OBJECT_TYPE}" != "tag" ]; then
            echo "::error::${TAG} is a ${OBJECT_TYPE}, not an annotated tag (R7 requires annotated)."
            exit 1
          fi

          # R12: no AI attribution anywhere in release metadata.
          if git tag -l --format='%(contents)' "${TAG}" | grep -qiE 'co-authored-by:.*(claude|anthropic)|generated with .*claude'; then
            echo "::error::${TAG} message contains AI attribution (R12 forbids it)."
            exit 1
          fi

          # The tag must name the version the package declares, or consumers get a version that
          # does not exist in git.
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::package.json version ${PKG_VERSION} does not match tag ${TAG}."
            exit 1
          fi

          # Provenance is rejected if the declared repository does not match the building repo.
          # This MUST be an exact comparison, not a substring one: `*owner/UmbraDB*` would also
          # accept `owner/UmbraDB-evil`. Normalise the accepted git URL spellings to `owner/repo`
          # and compare exactly.
          REPO_URL="$(node -p "require('./package.json').repository?.url ?? ''")"
          NORMALISED="${REPO_URL#git+}"
          NORMALISED="${NORMALISED#https://github.com/}"
          NORMALISED="${NORMALISED#git@github.com:}"
          NORMALISED="${NORMALISED#ssh://git@github.com/}"
          NORMALISED="${NORMALISED%.git}"
          if [ "$NORMALISED" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::package.json repository.url (${REPO_URL}) resolves to '${NORMALISED}', not '${GITHUB_REPOSITORY}'; provenance would fail."
            exit 1
          fi

          echo "Tag verified: annotated, v${PKG_VERSION}, repository matches ${GITHUB_REPOSITORY}."

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build the publishable surface
        run: npm run build

      - name: Assert the built surface exists
        shell: bash
        run: |
          set -euo pipefail
          # R3/R7: the declaration file is the frozen surface consumers compile against. If the
          # build silently emitted nothing, publishing would ship an empty package.
          test -f dist/index.js  || { echo "::error::dist/index.js missing after build."; exit 1; }
          test -f dist/index.d.ts || { echo "::error::dist/index.d.ts missing after build."; exit 1; }

      - name: Assert an npm token is configured
        # Without this the step below fails with an opaque `npm ERR! code ENEEDAUTH` several minutes
        # into a release run. Publishing is deliberately NOT skipped when the token is missing: a
        # tag that was meant to publish and silently did not is worse than a loud failure.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not configured for this repository, so this tag cannot be"
            echo "::error::published. Add it as a repository secret (and, if the workflow's"
            echo "::error::'npm-publish' environment has protection rules, grant this workflow access)"
            echo "::error::then re-run this job via workflow_dispatch on the same tag."
            exit 1
          fi
          echo "npm token present."

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
